
---
- name: Deploy Nexus Repository
  hosts: nexus
  become: true

  vars:
    nexus_dir: /opt/nexus

  tasks:
    - name: Create Nexus project directory
      ansible.builtin.file:
        path: "{{ nexus_dir }}"
        state: directory
        mode: "0755"

    - name: Create Nexus Docker Compose file
      ansible.builtin.copy:
        dest: "{{ nexus_dir }}/compose.yml"
        mode: "0644"
        content: |
          services:
            nexus:
              image: sonatype/nexus3:latest
              container_name: nexus
              restart: unless-stopped
              ports:
                - "127.0.0.1:8081:8081"
              volumes:
                - nexus_data:/nexus-data

          volumes:
            nexus_data:

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ nexus_dir }}"
      changed_when: false

    - name: Deploy Nexus
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ nexus_dir }}"
      changed_when: true

    - name: Verify Nexus container
      ansible.builtin.command:
        cmd: docker ps --filter name=nexus
      register: nexus_status
      changed_when: false

    - name: Display Nexus status
      ansible.builtin.debug:
        var: nexus_status.stdout_lines
